[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info

[program:backend]
command=uvicorn app:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/app/logs/backend.err
stderr_logfile_maxbytes=10MB
priority=10

[program:frontend]
command=streamlit run ui.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=15
stdout_logfile=/app/logs/frontend.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/app/logs/frontend.err
stderr_logfile_maxbytes=5MB
environment=AIOPS_BACKEND_URL="http://localhost:8000"
priority=20

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
