[linux_lab]
linux-lab-01 ansible_host=linux-lab-01
linux-lab-02 ansible_host=linux-lab-02

[linux_lab:vars]
ansible_user=ansible
ansible_password=LabPassword123!
ansible_become=true
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[network_lab]
network-lab-01 ansible_host=network-lab-01

[network_lab:vars]
ansible_user=ansible
ansible_password=LabPassword123!
ansible_become=true
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[vpn_lab]
vpn-lab-01 ansible_host=vpn-lab-01

[vpn_lab:vars]
ansible_user=ansible
ansible_password=LabPassword123!
ansible_become=true
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

