---
- name: Governed diagnostic playbook for pod_crash_loop
  hosts: linux-lab-01
  gather_facts: false
  become: false

  tasks:
    - name: Show target host
      ansible.builtin.debug:
        msg: "Running governed diagnostic automation for pod_crash_loop on {{ inventory_hostname }}."

    - name: Validate host reachability
      ansible.builtin.ping:

    - name: Print reviewed candidate steps
      ansible.builtin.shell: |
        echo '- Inspect Pod Logs'\n        echo '- Verify Container Resource Limits'\n        echo '- Compare Pod Configuration With Baseline'\n        echo '- Isolate And Redeploy Pod If Necessary'
      register: candidate_steps
      changed_when: false
      failed_when: false

    - name: Display reviewed candidate steps
      ansible.builtin.debug:
        var: candidate_steps.stdout_lines
